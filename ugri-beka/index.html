<meta charset="utf-8">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Ugri Béka</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
<style>
/* Layout: egy teljes képernyős tavi vászon, rajta nagy, kerek, ujjbarát gombok. Egyetlen, szándékosan világos "tavi" kinézet. */
:root{
  --water:#4fbfe0;
  --leaf:#7ccf4a;
  --leaf-dark:#2f6b23;
  --ink:#1d3a2a;
  --sun:#ffd23f;
  --pink:#ff7aa8;
  --card:#fffaf0;
  --font-display:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--water);color:var(--ink);font-family:var(--font-display);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
[hidden]{display:none!important}
#game{position:fixed;inset:0;display:block;touch-action:none}
.btn{appearance:none;border:4px solid var(--ink);background:var(--card);color:var(--ink);border-radius:999px;
  font-family:var(--font-display);font-weight:800;cursor:pointer;box-shadow:0 5px 0 var(--ink);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
.round{width:58px;height:58px;display:grid;place-items:center;padding:0}
.round svg{width:30px;height:30px}
#topbar{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:calc(env(safe-area-inset-right,0px) + 12px);display:flex;gap:12px;z-index:5}
#hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:calc(env(safe-area-inset-left,0px) + 12px);z-index:5;
  display:flex;align-items:center;gap:10px;background:var(--card);border:4px solid var(--ink);border-radius:999px;padding:4px 16px 4px 8px;
  font-size:28px;font-weight:800;box-shadow:0 5px 0 var(--ink);font-variant-numeric:tabular-nums}
#hud svg{width:40px;height:40px}
#dots{display:flex;gap:6px;margin-left:6px}
#dots i{width:14px;height:14px;border-radius:50%;border:3px solid var(--ink);background:#fff}
#dots i.on{background:var(--sun)}
.overlay{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:rgba(20,70,90,.35)}
.panel{background:linear-gradient(180deg,#fffdf4 0%,#f2f9e4 100%);border:5px solid var(--ink);border-radius:36px;box-shadow:0 10px 0 var(--ink);padding:24px 24px 28px;
  max-width:min(440px,100%);width:100%;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;box-sizing:border-box}
h1{margin:0;font-size:clamp(44px,12vw,64px);line-height:.95;color:var(--leaf);text-wrap:balance;letter-spacing:.5px;
  -webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink)}
h2{margin:0;font-size:clamp(38px,10vw,54px);line-height:1;color:var(--leaf);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink)}
.play{width:150px;height:150px;border-radius:50%;background:var(--leaf);display:grid;place-items:center;padding:0}
.play svg{width:80px;height:80px;margin-left:10px}
.row{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.big{width:110px;height:110px}
.big svg{width:56px;height:56px}
.stars{display:flex;gap:6px}
.stars svg{width:56px;height:56px;animation:pop .5s cubic-bezier(.3,1.8,.5,1) both}
.stars svg:nth-child(2){animation-delay:.15s}.stars svg:nth-child(3){animation-delay:.3s}
@keyframes pop{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1)}}
#qrImg{width:220px;height:220px;max-width:100%;border:4px solid var(--ink);border-radius:18px;background:#fff;image-rendering:pixelated}
.small{font-family:system-ui,sans-serif;font-size:14px;line-height:1.4;color:#3c5446;margin:0;max-width:34ch}
.url{font-family:ui-monospace,monospace;font-size:12px;word-break:break-all;background:#eef6e8;border-radius:10px;padding:6px 10px;max-width:100%;box-sizing:border-box;-webkit-user-select:all;user-select:all}
.pill{padding:12px 20px;font-size:18px}
#closeQr{position:absolute;top:-18px;right:-12px;width:52px;height:52px}
.panel.rel{position:relative}
#startFrog{width:180px;height:150px}

/* Béka- és pályaválasztó */
#startFrog{width:160px;height:133px}
.pick{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;width:100%}
.pick button{aspect-ratio:1;width:100%;max-width:64px;justify-self:center;padding:0;border-radius:18px;border:3px solid var(--ink);background:#eaf6df;box-shadow:0 3px 0 var(--ink);cursor:pointer;transition:transform .12s}
.pick button[aria-checked="true"]{background:var(--sun);transform:scale(1.1)}
.pick button:focus-visible,.lv button:focus-visible{outline:4px solid var(--sun);outline-offset:2px}
.pick canvas{width:100%;height:100%;display:block}
.lv{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.lv button{width:46px;height:46px;border-radius:50%;border:3px solid var(--ink);background:#fff;font-size:22px;line-height:1;padding:0;box-shadow:0 3px 0 var(--ink);cursor:pointer;transition:transform .12s}
.lv button[aria-checked="true"]{background:var(--sun);transform:scale(1.12)}
@media (max-width:420px){ .pick{grid-template-columns:repeat(3,1fr)} .pick button{max-width:72px} #startFrog{width:130px;height:108px} .lv button{width:40px;height:40px;font-size:19px} #dots i{width:10px;height:10px;border-width:2px} #dots{gap:4px} }
@media (max-width:420px) and (max-height:700px){ #startFrog{display:none} }
@media (max-width:360px){ .lv{gap:5px} .lv button{width:36px;height:36px;font-size:17px;border-width:2px} .pick{gap:6px} }
@media (max-height:520px){ #startFrog{display:none} .pick{width:auto;grid-template-columns:repeat(6,46px)} .lv button{width:38px;height:38px;font-size:18px} }

.lvlnum{margin-left:4px;padding:0 10px;border-radius:999px;background:var(--sun);border:3px solid var(--ink);font-size:.8em;line-height:1.35}
.lv{align-items:center}
.lv button{font-weight:800;font-family:var(--font-display);font-size:26px;color:var(--ink)}
.lv button:disabled{opacity:.3;cursor:default}
.lvbadge{min-width:86px;height:46px;padding:0 12px;box-sizing:border-box;border-radius:999px;border:3px solid var(--ink);background:var(--sun);box-shadow:0 3px 0 var(--ink);
  display:flex;align-items:center;justify-content:center;gap:4px;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
@media (max-width:420px){ .lv{gap:6px} .lv button{width:38px;height:38px;font-size:22px} .lvbadge{min-width:72px;height:40px;font-size:20px;padding:0 8px} }
@media (max-width:360px){ .lv{gap:4px!important} .lv button{width:36px!important;height:36px!important;font-size:20px} .lvbadge{min-width:0;font-size:17px;padding:0 7px;height:38px} }

/* Telefonra hangolás */
.overlay{overflow-y:auto;padding-top:12px;padding-bottom:12px}
.panel{margin:auto}
#game{width:100vw;height:100vh;height:100dvh}
@media (max-width:420px){
  .round{width:48px;height:48px;border-width:3px}
  .round svg{width:24px;height:24px}
  #topbar{gap:8px;top:calc(env(safe-area-inset-top,0px) + 8px);right:calc(env(safe-area-inset-right,0px) + 8px)}
  #hud{top:calc(env(safe-area-inset-top,0px) + 8px);left:calc(env(safe-area-inset-left,0px) + 8px);font-size:22px;padding:2px 12px 2px 6px;border-width:3px;gap:6px}
  #hud svg{width:30px;height:30px}
  .panel{padding:18px 16px 22px;border-radius:28px}
}
@media (max-width:380px){ #dots{display:none} }
@media (max-height:520px){
  .panel{max-width:min(680px,100%);flex-direction:row;flex-wrap:wrap;justify-content:center;align-items:center;padding:12px 20px 16px;gap:8px 18px}
  .panel h1,.panel h2{width:100%;font-size:38px}
  #startFrog{width:140px;height:117px}
  .play{width:104px;height:104px}
  .play svg{width:56px;height:56px}
  .big{width:84px;height:84px}
  .big svg{width:44px;height:44px}
  .stars svg{width:44px;height:44px}
  #qrImg{width:150px;height:150px}
  .panel .small{display:none}
  .round{width:48px;height:48px}
  .round svg{width:24px;height:24px}
  #hud{font-size:22px}
  #hud svg{width:30px;height:30px}
}
</style>

<div id="topbar">
  <button class="btn round" id="musicBtn" aria-label="Zene be/ki">
    <svg id="musicOn" viewBox="0 0 24 24" fill="none" stroke="#1d3a2a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="2.8" fill="#1d3a2a"/><circle cx="17.5" cy="16" r="2.8" fill="#1d3a2a"/></svg>
    <svg id="musicOff" viewBox="0 0 24 24" fill="none" stroke="#1d3a2a" stroke-width="2.6" stroke-linecap="round" hidden><path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="2.8" fill="#1d3a2a"/><circle cx="17.5" cy="16" r="2.8" fill="#1d3a2a"/><path d="M3 3l18 18" stroke="#e0483c" stroke-width="3"/></svg>

  </button>
</div>

<div class="overlay" id="startScreen">
  <div class="panel">
    <h1>Ugri Béka</h1>
    <canvas id="startFrog" width="360" height="300" aria-hidden="true"></canvas>
    <div id="frogPick" class="pick" role="radiogroup" aria-label="Válassz békát"></div>
    <div id="levelPick" class="lv" role="group" aria-label="Pályaválasztó"></div>
    <button class="btn play" id="playBtn" aria-label="Játék indítása">
      <svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z" fill="#fffaf0" stroke="#1d3a2a" stroke-width="2.2" stroke-linejoin="round"/></svg>
    </button>
    <p class="small">Koppints a levélre, és a béka odaugrik!</p>
  </div>
</div>

<div class="overlay" id="winScreen" hidden>
  <div class="panel">
    <h2>Ügyes vagy!</h2>
    <div class="stars" id="winStars"></div>
    <div class="row">
      <button class="btn round big" id="againBtn" aria-label="Újra">
        <svg viewBox="0 0 24 24" fill="none" stroke="#1d3a2a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v5h5"/></svg>
      </button>
      <button class="btn round big" id="nextBtn" aria-label="Következő pálya" style="background:var(--leaf)">
        <svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z" fill="#fffaf0" stroke="#1d3a2a" stroke-width="2.2" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>
</div>

<div class="overlay" id="qrScreen" hidden>
  <div class="panel rel">
    <button class="btn round" id="closeQr" aria-label="Bezárás">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1d3a2a" stroke-width="3.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <h2 style="font-size:34px">Küldd el!</h2>
    <img id="qrImg" alt="QR kód a játék linkjével">
    <p class="small" id="qrHint">Olvasd be a QR kódot egy másik telefonnal vagy tablettel. Mentéshez nyomd hosszan a képet, vagy használd a Letöltés gombot.</p>
    <div class="url" id="qrUrl"></div>
    <div class="row">
      <button class="btn pill" id="copyBtn">Link másolása</button>
      <button class="btn pill" id="dlBtn">QR letöltése</button>
      <button class="btn pill" id="shareBtn" hidden>Megosztás</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

(function(){

const lerp = (a,b,t) => a+(b-a)*t;
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const dist = (a,b,c,d) => Math.hypot(a-c, b-d);
function store(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v);}catch(e){ return null; } }

/* ====== Békafajták ====== */
const FROGS = [
  {id:'zoldi', name:'Zöldi, a tavi béka',      color:'#80d856', mid:'#52b03a', dark:'#2f7d2a', light:'#cdf7a6', pat:'spots', voice:1},
  {id:'keki',  name:'Kéki király',             color:'#5aaeff', mid:'#2f7ae0', dark:'#132a5c', light:'#c6e6ff', pat:'dots', acc:'crown', voice:1.22},
  {id:'levi',  name:'Levi, a piros szemű',     color:'#79e25a', mid:'#3cb83a', dark:'#1f6b2a', light:'#dcffc4', pat:'sides', iris:'#e8322a', slit:true, voice:1.12},

];
let SP = FROGS.find(f => f.id === store('ugri-beka-faj')) || FROGS[0];
let FRIEND = FROGS[1];
function pickFriend(){ const i = FROGS.indexOf(SP), n = FROGS.length; return FROGS[(i + 1 + (level % (n-1))) % n]; }

/* ====== Hangulatok ====== */
const THEMES = {

  night:  {water:['#1d527c','#0b2742'], grass:['#2e6a48','#1b4632'], tuft:'rgba(15,50,30,.6)', sand:'#8f8a6a', pad:['#8fe0b0','#46a476','#235f45'], caustic:.45, vign:.45, ambient:'fireflies', night:true}
};
let TH = THEMES.day;
const LEVEL_INFO = [
  {name:'Napos tó', theme:'day', icon:'\u2600\ufe0f'},
  {name:'Virágos hullámok', theme:'bloom', icon:'\ud83c\udf38'},

];

/* ====== Pályák (előre megtervezve): x, távolság az előzőtől, sugár (farönknél fél-vastagság), extrák ====== */
const LEVELS = [
  [[200,0,62],[135,120,54],[235,118,54],[165,118,54,{fly:1}],[255,115,52,{flower:1}],[175,120,52],[105,112,52,{fly:1}],[190,118,52],[275,115,52,{fly:1,flower:1}],[200,135,76,{goal:1}]],
  [[200,0,62],[140,120,54,{fly:1}],[200,125,52,{move:40,spd:.7}],[290,118,52],[210,120,52,{move:45,spd:.6,fly:1}],[120,118,52,{flower:1}],[190,120,52,{move:45,spd:.8}],[270,118,52,{fly:1}],[180,122,52,{move:45,spd:.7}],[110,118,52,{fly:1}],[200,135,76,{goal:1}]],
  [[200,0,62],[260,118,54],[180,122,50,{turtle:1}],[100,118,44,{stone:1,fly:1}],[185,118,52],[270,118,50,{turtle:1,fly:1}],[200,120,44,{stone:1}],[120,118,52,{flower:1}],[200,120,50,{turtle:1}],[285,118,52,{fly:1}],[200,135,76,{goal:1}]],
  [[200,0,62],[200,120,22,{log:1,w:170,move:40,spd:.5}],[110,118,42,{stone:1,fly:1}],[200,118,22,{log:1,w:160,move:50,spd:.6}],[290,118,52],[200,120,22,{log:1,w:180,move:45,spd:.45,fly:1}],[110,118,44,{stone:1}],[190,118,52,{flower:1}],[260,118,22,{log:1,w:150,move:40,spd:.55}],[180,118,52,{fly:1}],[200,135,76,{goal:1}]],
  [[200,0,62],[140,120,52,{fly:1}],[220,122,44,{duck:1,move:55,spd:.5}],[300,118,52],[200,120,44,{duck:1,move:60,spd:.45,fly:1}],[110,118,52,{flower:1}],[190,120,44,{duck:1,move:55,spd:.55}],[280,118,52,{fly:1}],[190,120,46,{stone:1}],[110,118,52,{fly:1}],[200,135,76,{goal:1}]],
  [[200,0,62],[130,120,52,{fly:1}],[220,120,44,{stone:1}],[300,118,52,{fly:1,flower:1}],[210,120,50,{move:40,spd:.6}],[120,118,46,{stone:1,fly:1}],[200,120,50,{turtle:1}],[285,118,52],[200,120,50,{move:40,spd:.7,fly:1}],[115,118,52],[200,135,76,{goal:1}]]
];

/* ====== Több száz pálya: az első 6 kézzel készült, a többit egy rögzített "mag" alapján generáljuk ======
   A nehézség (D: 0..1) lassan nő: kisebb és gyorsabb levelek, lebukó teknősök, süllyedő levelek;
   a végén nincs célra igazítás és előre-számolás, pontosan kell időzíteni. */
const TOTAL = 300;

/* --- Valószerű béka- és vízhangok: előre kiszámolt hangminták ---
   Egy igazi béka hangja gyors hangszál-pulzusokból áll, amit a torka és a szája
   "formánsokká" szűr. Ezt utánozzuk: pulzussorozat + három rezonátor. */
const SND = {};
function makeBuf(dur, fill){
  const sr = AC.sampleRate, n = Math.floor(dur*sr), b = AC.createBuffer(1, n, sr), d = b.getChannelData(0);
  fill(d, sr);
  let m = 0; for(let i=0;i<n;i++){ const a = Math.abs(d[i]); if(a > m) m = a; }
  if(m > 0) for(let i=0;i<n;i++) d[i] *= 0.9/m;

  const r = Math.exp(-Math.PI*bw/sr), a1 = -2*r*Math.cos(2*Math.PI*f/sr), a2 = r*r, g = 1 - r; let y1 = 0, y2 = 0;

  for(const s of syls){
    const r = [reso(s.f1, s.b1||120, sr), reso(s.f2, s.b2||220, sr), reso(s.f3, s.b3||350, sr)];
    const i0 = Math.floor(s.t*sr), n = Math.floor(s.d*sr), tail = Math.floor(0.04*sr); let ph = 0;
    for(let i=0; i<n+tail && i0+i<d.length; i++){
      const t = i/sr, k = Math.min(1, i/n);
      const e = i < n ? Math.min(1, t/0.008) * Math.pow(1-k, 0.6) * (0.7 + 0.3*Math.sin(Math.PI*k)) : 0;
      ph += s.rate*(1 + (s.glide||0)*k)/sr; let x = 0;
      if(ph >= 1){ ph -= 1; x = e*(0.75 + Math.random()*0.5); }
      x += e*(Math.random()*2-1)*0.04;
      d[i0+i] += r[0](x) + r[1](x)*0.7 + r[2](x)*0.35;
    }
  }
}
function fartFill(d, sr, base){ // "prrrrt-t-t": ajak-rezgés pulzusai, lötyögő hangmagassággal, a végén akadozik
  const n = d.length, r1 = reso(150, 90, sr), r2 = reso(430, 240, sr); let ph = 0, lp = 0, nz = 0;
  for(let i=0;i<n;i++){

    const f = base*(1 - 0.42*k) + 14*Math.sin(2*Math.PI*6*t) + 7*Math.sin(2*Math.PI*13.7*t) + (Math.random()-0.5)*10;

    if(k > 0.6) e *= Math.sin(2*Math.PI*(8 + 10*k)*t) > -0.25 ? 1 : 0.12;

}

const TRICKS = ['normal','spin','flip','wiggle','big','normal'];
function startJump(tx,ty,dur){
  frog.state = 'jump'; frog.jt = 0; frog.jdur = dur; frog.fx = frog.x; frog.fy = frog.y; frog.tx = tx; frog.ty = ty;
  frog.trick = TRICKS[Math.floor(Math.random()*TRICKS.length)]; frog.spinDir = Math.random() < 0.5 ? -1 : 1;
  frog.ang = Math.atan2(ty-frog.y, tx-frog.x) + Math.PI/2; frog.pad = null; idleT = 0;
  sfxRibbit(); if(frog.trick === 'spin' || frog.trick === 'big') sfxWhoosh();
  addRipple(frog.fx, frog.fy, 40, 2);
}
function onPad(p,x,y){
  if(p.log) return Math.abs(x-p.cx) < p.r + 4 && Math.abs(y-p.cy) < p.hh + 12;
  return dist(x,y,p.cx,p.cy) < p.r*0.95 + 8;
}
function land(){
  let hit = null;
  for(const p of pads){ if(onPad(p, frog.x, frog.y) && solid(p,time)){ hit = p; break; } }
  if(!hit){ startSink(); return; }
  const lim = hit.log ? [hit.r-16, hit.hh-6] : hit.duck ? [6, 5] : [hit.r*0.45, hit.r*0.45];
  frog.state = 'idle'; frog.pad = hit; frog.relX = clamp(frog.x-hit.cx, -lim[0], lim[0]); frog.relY = clamp(frog.y-hit.cy, -lim[1], lim[1]);
  hit.bob = 1; addRipple(hit.cx, hit.cy, (hit.log ? hit.hh : hit.r)+30, 3); sfxPlop();
  if(hit.duck) setTimeout(sfxQuack, 120); else if(hit.log || hit.stone) sfxKnock();
  burst(frog.x, frog.y, 8, ['#ffffff','#d8f6ff'], 90, 3.5, 0);
  if(hit.sinker && hit.sinkStart == null) hit.sinkStart = time;
  if(!hit.turtle && !hit.sinker) frog.lastSafe = hit;
  if(Math.random() < 0.35) setTimeout(sfxCroak, 150);
  if(hit.fly && !hit.flyGot){ hit.flyGot = true; frog.tongue = 1; frog.tongueTo = flyPos(hit); flies++; sfxYum();
    burst(frog.tongueTo.x, frog.tongueTo.y, 14, [C.sun,'#fff3a8','#ffffff'], 120, 5, 0); updateHud(); }
  if(hit.goal) startWin();
}
function startSink(){
  frog.state = 'sink'; frog.sinkT = 0; frog.pad = null; sfxSplash(); sfxFart(); addRipple(frog.x, frog.y, 42, 9);
  setTimeout(() => { for(let i=0;i<10;i++) particles.push({x:frog.x+(Math.random()-0.5)*24, y:frog.y+(Math.random()-0.5)*16, vx:(Math.random()-0.5)*30, vy:-30-Math.random()*60, life:1, decay:0.7+Math.random()*0.5, color:'#ffffff', size:4+Math.random()*6, grav:0, kind:'bubble'}); }, 150);
  for(let i=0;i<4;i++) setTimeout(() => addRipple(frog.x, frog.y, 70+i*15, 3), i*180);
  burst(frog.x, frog.y, 26, ['#ffffff','#bfefff','#8fdcf3'], 220, 6, 260);
}
function respawn(){
  const p = frog.lastSafe || pads[0];
  Object.assign(frog, {state:'pop', popT:0, pad:p, relX:0, relY:0, x:p.cx, y:p.cy}); p.bob = 1; sfxPop(); setTimeout(sfxCroak, 250);
  burst(p.cx, p.cy, 16, [C.sun,'#ffffff',C.pinkL], 140, 5, 0);
}
function startWin(){
  frog.state = 'win'; winT = 0; sfxWin(); setTimeout(sfxCroak, 500);
  MAXU = Math.max(MAXU, Math.min(level+1, TOTAL-1)); store('ugri-beka-max', String(MAXU));
}
function flyPos(p){ return {x:p.cx + Math.cos(time*2+p.i)*p.r*0.55, y:p.cy - p.r*0.35 + Math.sin(time*3.1+p.i)*8}; }

function onTap(sx, sy){
  initAudio(); if(frog.state !== 'idle') return;
  const wx = (sx-offX)/scale, wy = sy/scale + camY;
  if(dist(wx,wy,frog.x,frog.y) < 30){ frog.puff = 1; sfxCroak(); return; }
  const dur = 0.62; let best = null, bd = 1e9;
  if(PRED > 0.05) for(const p of pads){
    const pp = padPos(p, time + dur*PRED);
    if(p.log) pp.x += clamp(wx - pp.x, -(p.r-18), p.r-18);
    const rr = p.log ? p.hh : p.r, dTap = dist(wx,wy,pp.x,pp.y), dF = dist(frog.x,frog.y,pp.x,pp.y);
    if(dTap < rr+SNAP && dF < MAXJ + rr*0.6 && dTap < bd){ bd = dTap; best = pp; }
  }
  let tx, ty;
  if(best){ tx = best.x; ty = best.y; }
  else { const dx = wx-frog.x, dy = wy-frog.y, d = Math.hypot(dx,dy); if(d < 8) return; const m = Math.min(d, MAXJ); tx = frog.x+dx/d*m; ty = frog.y+dy/d*m; }
  startJump(clamp(tx, 30, 370), ty, dur);
}
cv.addEventListener('pointerdown', e => { e.preventDefault(); onTap(e.clientX, e.clientY); });

function update(dt){
  time += dt; idleT += dt;
  for(const p of pads){ const pp = padPos(p,time); p.cx = pp.x; p.cy = pp.y; p.bob = Math.max(0, p.bob - dt*2.2);
    if(p.sinker && p.sinkStart != null && frog.pad !== p && time - p.sinkStart > p.delay + 2.6) p.sinkStart = null; }
  frog.puff = Math.max(0, frog.puff - dt*1.6); frog.tongue = Math.max(0, frog.tongue - dt*4);
  frog.blink = (time % 3.7) < 0.12 ? 1 : 0;
  if(frog.state === 'idle' || frog.state === 'win' || frog.state === 'pop'){
    if(frog.pad){ frog.x = frog.pad.cx + frog.relX; frog.y = frog.pad.cy + frog.relY; }
    if(frog.state === 'idle' && frog.pad && (frog.pad.turtle || frog.pad.sinker) && !solid(frog.pad,time)) startSink();
    if(frog.state === 'pop'){ frog.popT += dt; if(frog.popT > 0.55) frog.state = 'idle'; }
    if(frog.state === 'win'){ winT += dt;
      if(Math.random() < dt*14) particles.push({x:frog.x+(Math.random()-0.5)*300, y:camY-10, vx:(Math.random()-0.5)*60, vy:60+Math.random()*80, life:1, decay:0.25, color:[C.sun,C.pink,'#7ad3ff','#ffffff','#b48cff'][Math.random()*5|0], size:5+Math.random()*4, grav:20, rot:Math.random()*TAU, kind:'conf'});
      if(winT > 1.6 && !frog.winShown){ frog.winShown = true; showWin(); }
    }
  } else if(frog.state === 'jump'){
    frog.jt += dt; const k = Math.min(1, frog.jt/frog.jdur), e = k<.5 ? 2*k*k : 1-Math.pow(-2*k+2,2)/2;
    frog.x = lerp(frog.fx, frog.tx, e*0.3 + k*0.7); frog.y = lerp(frog.fy, frog.ty, e*0.3 + k*0.7);
    if(k >= 1) land();
  } else if(frog.state === 'sink'){
    frog.sinkT += dt;
    if(Math.random() < dt*10) particles.push({x:frog.x+(Math.random()-0.5)*20, y:frog.y+(Math.random()-0.5)*20, vx:0, vy:-10, life:1, decay:1.2, color:'#ffffff', size:3+Math.random()*4, grav:0, kind:'bubble'});
    if(frog.sinkT > 1.5) respawn();
  }
  for(const q of particles){ q.x += q.vx*dt; q.y += q.vy*dt; q.vy += q.grav*dt; q.vx *= (1-dt*2); if(q.kind!=='conf') q.vy *= (1-dt*2); q.life -= q.decay*dt; q.rot += dt*5; }
  particles = particles.filter(q => q.life > 0);
  for(const r of ripples){ r.r += (r.max - r.r)*dt*2.5 + dt*10; r.life -= dt*1.3; }
  ripples = ripples.filter(r => r.life > 0);
  const target = frog.y - viewH*0.66;
  camY += (target - camY) * Math.min(1, dt*3.5);
}

/* ====== Rajzolás ====== */
C.outline = '#234a2a';
const OUT = C.outline;
function ell(c,x,y,rx,ry,rot){ c.beginPath(); c.ellipse(x,y,Math.max(0.01,rx),Math.max(0.01,ry),rot||0,0,TAU); }
function fillStroke(c,fill,lw,stroke){ c.fillStyle = fill; c.fill(); c.lineWidth = lw||2.4; c.strokeStyle = stroke||OUT; c.stroke(); }
function softShadow(c,x,y,rx,ry,a){
  c.save(); c.translate(x,y); c.scale(1, ry/rx);
  const g = c.createRadialGradient(0,0,rx*0.15,0,0,rx); g.addColorStop(0,'rgba(8,45,70,'+a+')'); g.addColorStop(1,'rgba(8,45,70,0)');
  c.fillStyle = g; c.beginPath(); c.arc(0,0,rx,0,TAU); c.fill(); c.restore();
}
function star4(c,x,y,s){
  c.beginPath(); c.moveTo(x,y-s); c.quadraticCurveTo(x,y,x+s,y); c.quadraticCurveTo(x,y,x,y+s); c.quadraticCurveTo(x,y,x-s,y); c.quadraticCurveTo(x,y,x,y-s); c.fill();
}

/* --- víz: fényhálózat (kausztika) csempék --- */
const CT = 230; let causticTiles = [], causticK = 0;
function makeCaustic(seed, px){
  const cv2 = document.createElement('canvas'); cv2.width = cv2.height = px; const g = cv2.getContext('2d'); g.scale(px/CT, px/CT);
  g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = '#ffffff';
  const N = 4, cell = CT/N;
  for(let i=0;i<N;i++) for(let j=0;j<N;j++){
    const cx = (i+0.5)*cell + (rnd(seed+i*17+j*31)-0.5)*cell*0.5, cy = (j+0.5)*cell + (rnd(seed+i*7+j*53+5)-0.5)*cell*0.5;
    const n = 7, pts = [];
    for(let v=0;v<n;v++){ const a = v/n*TAU + rnd(seed+i+j*3+v)*0.5, rr = cell*(0.42 + rnd(seed*3+i*11+j*5+v)*0.16); pts.push([Math.cos(a)*rr, Math.sin(a)*rr]); }
    g.lineWidth = 2 + rnd(seed+i*5+j)*1.8;
    for(const ox of [-CT,0,CT]) for(const oy of [-CT,0,CT]){
      g.beginPath();
      for(let v=0;v<=n;v++){ const p0 = pts[v%n], p1 = pts[(v+1)%n], mx = (p0[0]+p1[0])/2+cx+ox, my = (p0[1]+p1[1])/2+cy+oy;
        if(v === 0) g.moveTo(mx,my); else g.quadraticCurveTo(p0[0]+cx+ox, p0[1]+cy+oy, mx, my); }
      g.stroke();
    }
  }
  return cv2;
}
function ensureCaustics(){
  const k = scale*dpr; if(causticTiles.length && Math.abs(k-causticK) < 0.01) return;
  causticK = k; const px = Math.min(1024, Math.round(CT*k)); causticTiles = [makeCaustic(3,px), makeCaustic(41,px)];
}
function drawCausticLayer(c, tile, ox, oy, alpha, top, bot){
  const left = -offX/scale - CT, right = WORLD_W + offX/scale;
  c.globalAlpha = alpha;
  const sx = Math.floor((left-ox)/CT)*CT + ox, sy = Math.floor((top-oy)/CT)*CT + oy;
  for(let x=sx; x<right; x+=CT) for(let y=sy; y<bot; y+=CT) c.drawImage(tile, x, y, CT+0.6, CT+0.6);
  c.globalAlpha = 1;
}

/* --- tavirózsa-levél: előre megrajzolt kép (gyors) --- */
function makePadSprite(R, rot, seed, k, goal, pal){
  const m = 6, half = R+m, px = Math.ceil(half*2*k), cv2 = document.createElement('canvas'); cv2.width = cv2.height = px;
  const g = cv2.getContext('2d'); g.scale(px/(half*2), px/(half*2)); g.translate(half, half); g.lineJoin = 'round'; g.lineCap = 'round';
  const a0 = 0.34 + rot, a1 = TAU - 0.04 + rot;
  const shape = () => { g.beginPath(); g.moveTo(0,0);
    for(let s=0;s<=56;s++){ const a = a0 + (a1-a0)*s/56, w = R*(1 + 0.022*Math.sin(a*6+seed) + 0.014*Math.sin(a*15+seed*2)); g.lineTo(Math.cos(a)*w, Math.sin(a)*w); }
    g.closePath(); };
  shape();
  const gr = g.createRadialGradient(-R*0.35,-R*0.4,R*0.05,0,0,R*1.05);
  if(goal){ gr.addColorStop(0,'#dcf8a8'); gr.addColorStop(0.55,'#93db5d'); gr.addColorStop(1,'#58aa3d'); }
  else { const P = pal || ['#c2f08e','#7acb4f','#4c9c37']; gr.addColorStop(0,P[0]); gr.addColorStop(0.55,P[1]); gr.addColorStop(1,P[2]); }
  g.fillStyle = gr; g.fill();
  g.save(); shape(); g.clip();
  g.lineWidth = R*0.24; g.strokeStyle = 'rgba(40,100,35,.26)'; shape(); g.stroke();
  for(let b=0;b<5;b++){ const a = rnd(seed*5+b)*TAU, d = R*(0.3+rnd(seed*7+b)*0.5);
    g.fillStyle = b%2 ? 'rgba(235,225,120,.22)' : 'rgba(40,110,40,.16)';
    ell(g, Math.cos(a)*d, Math.sin(a)*d, R*(0.08+rnd(seed+b*3)*0.1), R*(0.06+rnd(seed+b*9)*0.07), a); g.fill(); }
  const nv = 13;
  for(let v=0;v<nv;v++){
    const a = a0 + 0.1 + (a1-a0-0.2)*(v+0.5)/nv, bend = (rnd(seed+v)-0.5)*0.25;
    g.beginPath(); g.moveTo(0,0); g.quadraticCurveTo(Math.cos(a+bend)*R*0.5, Math.sin(a+bend)*R*0.5, Math.cos(a)*R*0.94, Math.sin(a)*R*0.94);
    g.strokeStyle = 'rgba(238,255,205,.6)'; g.lineWidth = 1.9; g.stroke();
    for(const t of [0.48,0.7]){ const bx = Math.cos(a+bend*0.5)*R*t, by = Math.sin(a+bend*0.5)*R*t;
      for(const sg of [-1,1]){ const ba = a + sg*0.4; g.beginPath(); g.moveTo(bx,by); g.lineTo(bx+Math.cos(ba)*R*0.14, by+Math.sin(ba)*R*0.14); g.lineWidth = 1.1; g.strokeStyle = 'rgba(238,255,205,.38)'; g.stroke(); } }
  }
  const sh = g.createRadialGradient(-R*0.4,-R*0.45,0,-R*0.4,-R*0.45,R*0.75); sh.addColorStop(0,'rgba(255,255,255,.38)'); sh.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle = sh; g.fillRect(-R,-R,R*2,R*2);
  g.restore();
  shape(); g.lineWidth = 2.8; g.strokeStyle = OUT; g.stroke();
  ell(g,0,0,R*0.05,R*0.05); g.fillStyle = 'rgba(60,120,40,.6)'; g.fill();
  const nd = goal ? 3 : (rnd(seed*13) < 0.6 ? 2 : 1);
  for(let d=0;d<nd;d++){
    const a = a0 + 0.5 + rnd(seed*17+d)*(a1-a0-1), dd = R*(0.35+rnd(seed*19+d)*0.4), x = Math.cos(a)*dd, y = Math.sin(a)*dd, r = R*(0.05+rnd(seed+d*23)*0.03);
    g.fillStyle = 'rgba(30,90,40,.25)'; ell(g,x+r*0.4,y+r*0.5,r,r); g.fill();
    const dg = g.createRadialGradient(x-r*0.3,y-r*0.3,0,x,y,r); dg.addColorStop(0,'rgba(255,255,255,.95)'); dg.addColorStop(0.6,'rgba(205,245,255,.65)'); dg.addColorStop(1,'rgba(160,230,255,.4)');
    g.fillStyle = dg; ell(g,x,y,r,r); g.fill(); g.lineWidth = 0.9; g.strokeStyle = 'rgba(40,110,60,.5)'; g.stroke();
    ell(g,x-r*0.35,y-r*0.35,r*0.28,r*0.28); g.fillStyle = '#fff'; g.fill();
  }
  return cv2;
}
function padSprite(p){
  const k = scale*dpr;
  if(!p.spr || Math.abs(p.sprK-k) > 0.01){ p.spr = makePadSprite(p.r, p.rot, p.i*7+level*31+1, k, p.goal, p.sinker ? SINK_PAL : TH.pad); p.sprK = k; }
  return p.spr;
}

/* --- virágok --- */
function drawLotus(c,x,y,s,spin){
  c.save(); c.translate(x,y);
  softShadow(c, 3, 5, s*1.1, s*1.0, 0.25);
  c.rotate(spin||0); c.lineJoin = 'round';
  const layer = (n,len,wid,off,c1,c2) => {
    for(let i=0;i<n;i++){ c.save(); c.rotate(off + i*TAU/n);
      const g = c.createLinearGradient(0,0,0,-len); g.addColorStop(0,c1); g.addColorStop(1,c2);
      c.beginPath(); c.moveTo(0,0); c.quadraticCurveTo(wid,-len*0.55,0,-len); c.quadraticCurveTo(-wid,-len*0.55,0,0);
      c.fillStyle = g; c.fill(); c.lineWidth = 1.5; c.strokeStyle = '#a8395f'; c.stroke();
      c.beginPath(); c.moveTo(0,-len*0.25); c.lineTo(0,-len*0.8); c.strokeStyle = 'rgba(255,255,255,.55)'; c.lineWidth = 1; c.stroke();
      c.restore(); }
  };
  layer(8, s, s*0.42, 0, '#ffe6f0', '#ff6f9f');
  layer(6, s*0.72, s*0.34, TAU/12, '#fff5f9', '#ff94bb');
  const cg = c.createRadialGradient(-s*0.06,-s*0.06,0,0,0,s*0.26); cg.addColorStop(0,'#fff3a0'); cg.addColorStop(1,'#f5b400');
  ell(c,0,0,s*0.25,s*0.25); fillStroke(c, cg, 1.5, '#a06a00');
  c.fillStyle = '#c98a00'; for(let i=0;i<6;i++){ const a = i*TAU/6; ell(c, Math.cos(a)*s*0.13, Math.sin(a)*s*0.13, s*0.03, s*0.03); c.fill(); }
  c.restore();
}
function drawFlower(c,x,y,s){ // százszorszép a parton
  c.save(); c.translate(x,y);
  for(let i=0;i<8;i++){ c.save(); c.rotate(i*TAU/8); ell(c, 0, -s*0.62, s*0.26, s*0.55); fillStroke(c, '#ffffff', 1.3); c.restore(); }
  ell(c,0,0,s*0.32,s*0.32); fillStroke(c, C.sun, 1.3); c.restore();
}

function drawPad(c, p){
  if(p.turtle){ drawTurtle(c, p, turtleSink(p,time)); return; }
  if(p.log){ drawLog(c, p); return; }
  if(p.stone){ drawStoneP(c, p); return; }
  if(p.duck){ drawDuck(c, p); return; }
  const bob = 1 - Math.sin(p.bob*Math.PI*3)*0.05*p.bob, R = p.r, half = R+6;
  if(p.goal){
    const pulse = (Math.sin(time*3)+1)/2;
    const gg = ctx.createRadialGradient(p.cx,p.cy,R*0.6,p.cx,p.cy,R*1.7); gg.addColorStop(0,'rgba(255,236,140,'+(0.45+pulse*0.25)+')'); gg.addColorStop(1,'rgba(255,236,140,0)');
    c.fillStyle = gg; ell(c,p.cx,p.cy,R*1.7,R*1.7); c.fill();
    c.fillStyle = '#fff8c8';
    for(let i=0;i<8;i++){ const a = time*0.5 + i*TAU/8, rr = R*1.3 + Math.sin(time*2+i)*6, tw = (Math.sin(time*4+i*1.7)+1)/2;
      c.globalAlpha = 0.4 + tw*0.6; star4(c, p.cx+Math.cos(a)*rr, p.cy+Math.sin(a)*rr, 4+tw*4); }
    c.globalAlpha = 1;
  }
  softShadow(c, p.cx+6, p.cy+9, R*1.1, R*1.02, 0.34);
  c.strokeStyle = 'rgba(255,255,255,' + (0.25 + 0.1*Math.sin(time*2+p.i)) + ')'; c.lineWidth = 3;
  ell(c, p.cx, p.cy, R*bob+4, R*bob+4); c.stroke();
  const sk = sinkerAmt(p), shk = sinkerWarn(p) ? Math.sin(time*45)*1.8 : 0;
  if(sk > 0.05 && Math.random() < 0.3) particles.push({x:p.cx+(Math.random()-0.5)*R, y:p.cy+(Math.random()-0.5)*R, vx:0, vy:-8, life:1, decay:1.5, color:'#ffffff', size:3+Math.random()*3, grav:0, kind:'bubble'});
  c.save(); c.translate(p.cx + shk, p.cy); c.scale(bob*(1-sk*0.3), bob*(1-sk*0.3)); c.globalAlpha = 1 - sk*0.85;
  c.drawImage(padSprite(p), -half, -half, half*2, half*2);
  if(p.flower) drawLotus(c, -R*0.45, R*0.42, 13, p.i);
  if(p.goal){ drawLotus(c, -R*0.62, -R*0.18, 20, time*0.15); drawLotus(c, R*0.64, R*0.36, 14, -time*0.2); }
  c.restore();
}
function rrect(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function drawLog(c, p){ // úszó farönk
  const bob = 1 - Math.sin(p.bob*Math.PI*3)*0.04*p.bob, w = p.r*2, h = p.hh*2;
  softShadow(c, p.cx+6, p.cy+10, p.r*1.05, p.hh*1.7, 0.32);
  c.strokeStyle = 'rgba(255,255,255,.3)'; c.lineWidth = 3; ell(c, p.cx, p.cy, p.r+8, p.hh+8); c.stroke();
  c.save(); c.translate(p.cx, p.cy); c.scale(1, bob); c.lineJoin = 'round';
  const g = c.createLinearGradient(0,-p.hh,0,p.hh); g.addColorStop(0,'#cf9356'); g.addColorStop(0.5,'#a8682f'); g.addColorStop(1,'#73451c');
  rrect(c, -p.r, -p.hh, w, h, p.hh); fillStroke(c, g, 2.8);
  c.strokeStyle = 'rgba(70,40,15,.5)'; c.lineWidth = 1.7;
  for(let i=0;i<8;i++){ const x = -p.r + 20 + i*(w-40)/7, yy = -p.hh + 6 + rnd(p.i*9+i)*(h-12); c.beginPath(); c.moveTo(x-13, yy); c.quadraticCurveTo(x, yy-2.5, x+13, yy+1); c.stroke(); }
  c.fillStyle = 'rgba(255,235,200,.28)'; rrect(c, -p.r+12, -p.hh+4, w-24, h*0.22, 4); c.fill();
  for(const s of [-1,1]){ const ex = s*(p.r - p.hh*0.4); ell(c, ex, 0, p.hh*0.4, p.hh*0.92); fillStroke(c, '#e8c088', 2.2);
    c.strokeStyle = 'rgba(130,80,35,.6)'; c.lineWidth = 1.2; for(const k of [0.66,0.33]){ ell(c, ex, 0, p.hh*0.4*k, p.hh*0.92*k); c.stroke(); } }
  c.save(); c.translate(p.r*0.3, -p.hh+2); c.rotate(-0.4); rrect(c,-3,-11,6,13,3); fillStroke(c,'#8f5a28',1.8);
  ell(c, 7, -13, 7, 4, -0.5); fillStroke(c, TH.night ? '#5f9a6a' : '#e08a2a', 1.4); c.restore();
  ell(c, -p.r*0.35, p.hh*0.35, 7, 4.5, 0.2); c.fillStyle = 'rgba(120,180,70,.7)'; c.fill();
  c.restore();
}
function drawStoneP(c, p){ // lépőkő
  const bob = 1 - Math.sin(p.bob*Math.PI*3)*0.02*p.bob;
  softShadow(c, p.cx+5, p.cy+8, p.r*1.12, p.r, 0.36);
  c.strokeStyle = 'rgba(255,255,255,.35)'; c.lineWidth = 3; ell(c, p.cx, p.cy, p.r+5, p.r*0.92+5); c.stroke();
  c.save(); c.translate(p.cx, p.cy); c.scale(bob, bob); c.rotate(p.rot*0.2); c.lineJoin = 'round';
  const g = c.createRadialGradient(-p.r*0.35,-p.r*0.4,2,0,0,p.r*1.1);
  g.addColorStop(0, TH.night ? '#c4cde0' : '#f2efe8'); g.addColorStop(1, TH.night ? '#5b667e' : '#9a948a');
  c.beginPath(); for(let k=0;k<=28;k++){ const a = k/28*TAU, w = p.r*(1 + 0.06*Math.sin(a*3+p.i) + 0.04*Math.sin(a*5+p.i*2)); c.lineTo(Math.cos(a)*w, Math.sin(a)*w*0.92); }
  c.closePath(); fillStroke(c, g, 2.8);
  c.fillStyle = 'rgba(110,170,70,.6)'; ell(c, p.r*0.32, p.r*0.32, p.r*0.36, p.r*0.2, 0.4); c.fill(); ell(c, -p.r*0.48, p.r*0.12, p.r*0.15, p.r*0.1); c.fill();
  c.strokeStyle = 'rgba(80,75,70,.45)'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(-p.r*0.2,-p.r*0.55); c.lineTo(0,-p.r*0.15); c.lineTo(-p.r*0.12,p.r*0.2); c.stroke();
  c.fillStyle = 'rgba(255,255,255,.4)'; ell(c, -p.r*0.35, -p.r*0.38, p.r*0.22, p.r*0.12, -0.5); c.fill();

function bankEdge(y, side){ return side < 0 ? 16 + Math.sin(y*0.03)*7 + Math.sin(y*0.071)*5 : 384 - Math.sin(y*0.027+2)*7 - Math.sin(y*0.065)*5; }
function drawBanks(c, top, bot){
  const leftEdge = -offX/scale - 5, rightEdge = WORLD_W + offX/scale + 5;
  for(const side of [-1,1]){
    const outer = side < 0 ? leftEdge : rightEdge;
    const path = (off, wob) => { c.beginPath(); c.moveTo(outer, top);
      for(let y = top; y <= bot+12; y += 10) c.lineTo(bankEdge(y,side) - side*off + (wob ? Math.sin(y*0.12 + time*1.6)*1.6 : 0), y);
      c.lineTo(outer, bot+12); c.closePath(); };
    path(-16); c.fillStyle = 'rgba(170,240,225,.3)'; c.fill();
    path(-7, true); c.fillStyle = 'rgba(255,255,255,.55)'; c.fill();
    path(-5); c.fillStyle = TH.sand; c.fill();
    c.fillStyle = 'rgba(170,130,70,.35)';
    for(let i=Math.floor(top/16); i<=Math.ceil(bot/16); i++){ const y = i*16 + rnd(i*3+side)*8; ell(c, bankEdge(y,side) + side*(1 + rnd(i*7)*3), y, 1.2, 1); c.fill(); }
    path(4);
    const gg = c.createLinearGradient(side < 0 ? 22 : 378, 0, outer, 0); gg.addColorStop(0,TH.grass[0]); gg.addColorStop(1,TH.grass[1]);
    c.fillStyle = gg; c.fill(); c.lineWidth = 3; c.strokeStyle = OUT; c.stroke();
    // fűszálak textúra
    c.strokeStyle = TH.tuft; c.lineWidth = 1.6; c.lineCap = 'round';
    const span = Math.abs(outer - (side < 0 ? 20 : 380));
    for(let i=Math.floor(top/24); i<=Math.ceil(bot/24); i++){
      for(let d=10; d<span; d+=22){
        const y = i*24 + rnd(i*13+d)*14, x = bankEdge(y,side) + side*(d + rnd(i+d*3)*10);
        c.beginPath(); c.moveTo(x-3,y); c.lineTo(x-4,y-6); c.moveTo(x,y); c.lineTo(x,y-8); c.moveTo(x+3,y); c.lineTo(x+4,y-6); c.stroke();
      }
    }
    const start = Math.floor(top/55), end = Math.ceil(bot/55);
    for(let i=start;i<=end;i++){
      const y = i*55 + rnd(i*3+side)*30, r = rnd(i*5+side*9), ex = bankEdge(y,side);
      if(r < 0.22) drawReed(c, ex - side*8, y, side);
      else if(r < 0.4) drawStone(c, ex + side*1, y, 7 + rnd(i*11)*5, i);
      else if(r < 0.62) drawFlower(c, ex + side*(span > 40 ? 14 + rnd(i)*Math.min(30, span-20) : 8), y, 6.5);
      else if(r < 0.72) { drawReed(c, ex - side*6, y, side); drawReed(c, ex - side*13, y+8, side); }
    }
  }
}

function draw(){

    const a = Math.max(0, r.life);

let last = performance.now(), running = false;
function loop(now){
  const dt = Math.min(0.05, (now - last)/1000); last = now;
  if(running) update(dt); else time += dt;
  draw(); requestAnimationFrame(loop);
}

  const src = tmp.querySelector('canvas');

  c.fillStyle = '#fffaf0'; c.fillRect(0,0,640,760); c.drawImage(src, 64, 64, 512, 512);

  qrData = out.toDataURL('image/png'); $('qrImg').src = qrData;

    dlApi.save({filename:'ugri-beka-qr.png', data:new Blob([arr], {type:'image/png'})}).catch(e => { if(!e || e.code !== 'declined') failHint(); });
    return;
  }
  const a = document.createElement('a'); a.href = qrData; a.download = 'ugri-beka-qr.png'; document.body.appendChild(a); a.click(); a.remove(); failHint();
});
